name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ---- Native matrix: build + full test on the three desktop OSes ----------
  native:
    name: ${{ matrix.os }} (stable)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Docs
        run: cargo doc --workspace --no-deps

  # ---- MSRV job: the declared rust-version must really compile --------------
  msrv:
    name: MSRV 1.78 (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.78
        uses: dtolnay/rust-toolchain@1.78.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check (MSRV)
        run: cargo check --workspace --all-targets

      - name: Test (MSRV)
        run: cargo test --workspace

  # ---- Android: cross-check via `cross` (handles the NDK in Docker) --------
  android:
    name: Android (aarch64 + x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cross check (Android)
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: check
          target: aarch64-linux-android
          args: --workspace

      - name: Cross check x86_64 (Android)
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: check
          target: x86_64-linux-android
          args: --workspace

  # ---- iOS: cross-check on macOS (needs the Xcode toolchain) ---------------
  ios:
    name: iOS (aarch64-apple-ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check (iOS)
        run: cargo check --workspace --target aarch64-apple-ios

  # ---- Lints: keep the tree warning-free -----------------------------------
  lint:
    name: clippy (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # ---- Wiki: publish docs after CI succeeds on main ------------------------
  # The `wiki/` directory in the repository is the source of truth. After every
  # green push to `main` it is pushed to the GitHub wiki (…/Corduit.wiki.git).
  #
  # Authentication uses the automatic `GITHUB_TOKEN` by default. If your
  # repository does not allow that token to push to the wiki, define a repo
  # secret `WIKI_PAT` with a fine-grained PAT that has "Read and write" access
  # to the wiki — the expression below falls back to it automatically.
  wiki:
    name: Publish Wiki
    needs: [native, msrv, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WIKI_TOKEN: ${{ secrets.WIKI_PAT || github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki repository
        run: |
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-out

      - name: Sync wiki pages
        run: |
          # Replace the wiki content with the tracked source of truth.
          rm -rf wiki-out/*
          cp -R wiki/* wiki-out/
          cd wiki-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to publish."
          else
            git commit -m "docs: sync wiki from main ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push origin HEAD:master
          fi
