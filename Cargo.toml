[workspace]
resolver = "3"
members = [
    "corduit-core",
    "corduit-dns",
    "corduit-lib",
    "corduit-netstack",
    "corduit-protocol",
]

[workspace.package]
edition = "2021"
license = "FSL-1.1-Apache-2.0"
version = "0.1.0"
authors = ["blueokanna"]
description = "A unified network proxy engine written in Rust"
homepage = "https://github.com/blueokanna/Corduit"
repository = "https://github.com/blueokanna/Corduit"
readme = "README.md"
rust-version = "1.77"
keywords = ["proxy", "vpn", "network", "tun", "rust", "clash"]
categories = ["network-programming", "web-programming"]

[workspace.dependencies]

# --- async runtime ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["net", "codec", "io", "compat"] }
tokio-test = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
tokio-tungstenite = "0.30"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
pin-project-lite = "0.2"
getrandom = { version = "0.4", features = ["std"] }

# --- error handling ---
thiserror = "2.0.20"

# --- serde ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# --- nextjson / rustbinary (next-generation serialization) ---
nextjson = { version = "0.1.2", features = ["derive"] }
nextjson-derive = "0.1.2"
rustbinary = { version = "0.1.4", features = ["derive"] }
rustbinary-derive = "0.1.4"

# --- tracing / telemetry ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "local-time",
] }
tracing-opentelemetry = "0.33"
tracing-android = "0.2"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }

# --- HTTP / axum ---
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server-auto",
    "client-legacy",
] }
http = "1"
http-body-util = "0.1"
axum = { version = "0.8", features = ["ws"] }
h2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "stream",
    "socks",
] }
url = "2"

# --- TLS / QUIC ---
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
quinn = { version = "0.11", default-features = false, features = [
    "futures-io",
    "runtime-tokio",
    "rustls",
] }
quinn-proto = { version = "0.11", default-features = false }
webpki-roots = "1"

# --- DNS ---
hickory-proto = { version = "0.26", default-features = false }
ipnet = "2"
lru = "0.18"

# --- crypto ---
aead = "0.6"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
blake2 = "0.10"
blake3 = "1"
sha1 = "0.11"
sha2 = "0.11"
hkdf = "0.13"
hmac = "0.13"
md-5 = "0.11"
curve25519-dalek = "5"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1"
rand = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"
hex = "0.4"

# --- networking ---
bytes = "1"
socket2 = { version = "0.6", features = ["all"] }
smoltcp = { version = "0.13", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-udp",
    "socket-tcp",
] }
bitflags = "2"
libc = "0.2"
maxminddb = "0.30"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }

# --- system / platform ---
sysinfo = "0.39"
tun-rs = { version = "2", features = ["async", "async_framed"] }
wintun-bindings = { version = "0.7", features = ["async"] }
zip = "8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
] }
jni = "0.22"

# --- dev ---
proptest = "1"

# --- internal crates (path for local dev, version required for publishing) ---
corduit-core = { path = "corduit-core", version = "0.1.0" }
corduit-dns = { path = "corduit-dns", version = "0.1.0" }
corduit-netstack = { path = "corduit-netstack", version = "0.1.0" }
corduit-protocol = { path = "corduit-protocol", version = "0.1.0" }
