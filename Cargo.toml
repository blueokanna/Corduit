[workspace]
resolver = "3"
members = [
    "corduit-core",
    "corduit-dns",
    "corduit-lib",
    "corduit-netstack",
    "corduit-protocol",
]

[workspace.package]
edition = "2021"
license = "PolyForm-Perimeter-1.0.1"
version = "0.1.0"
authors = ["blueokanna"]
description = "A unified network proxy engine written in Rust"
homepage = "https://github.com/blueokanna/Corduit"
repository = "https://github.com/blueokanna/Corduit"
readme = "README.md"
rust-version = "1.85"
keywords = ["proxy", "connection", "network", "tun", "rust"]
categories = ["network-programming", "web-programming"]

[workspace.dependencies]

# --- async runtime / concurrency --------------------------------------------
async-trait = "0.1"
dashmap = "6"
futures = "0.3"
once_cell = "1"
parking_lot = "0.12"
pin-project-lite = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
tokio-util = { version = "0.7", features = ["net", "codec", "io", "compat"] }

# --- error handling ----------------------------------------------------------
thiserror = "2.0.20"

# --- nextjson / rustbinary (native) --------
nextjson = { version = "0.1.3", features = ["derive"] }
nextjson-derive = "0.1.3"
rustbinary = { version = "=0.1.5-alpha.1", features = ["derive"] }
rustbinary-derive = "0.1.4"

# --- tracing / telemetry -----------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "local-time",
] }
tracing-opentelemetry = "0.33"
tracing-android = "0.2"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }

# --- HTTP / axum -------------------------------------------------------------
axum = "0.8"
h2 = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server-auto",
    "client-legacy",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "stream",
    "socks",
] }
url = "2"

# --- TLS / QUIC --------------------------------------------------------------
quinn = { version = "0.11", default-features = false, features = [
    "futures-io",
    "runtime-tokio",
    "rustls",
] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
tokio-tungstenite = "0.30"
webpki-roots = "1"

# --- DNS ---------------------------------------------------------------------
hickory-proto = { version = "0.26", default-features = false }
ipnet = "2"
lru = "0.18"

# --- crypto ------------------------------------------------------------------
aead = "0.6"
aes-gcm = "0.11"
base64 = "0.23"
blake2 = "0.10"
blake3 = "1"
chacha20poly1305 = "0.11"
getrandom = { version = "0.4", features = ["std"] }
hex = "0.4"
hkdf = "0.13"
md-5 = "0.11"
rand = "0.10"
sha1 = "0.11"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }

# --- networking / system -----------------------------------------------------
bitflags = "2"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
libc = "0.2"
maxminddb = "0.30"
regex = "1"
smoltcp = { version = "0.13", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-udp",
    "socket-tcp",
] }
socket2 = { version = "0.6", features = ["all"] }
sysinfo = "0.39"
tun-rs = { version = "2", features = ["async", "async_framed"] }
wintun-bindings = { version = "0.7", features = ["async"] }
zip = "8"

# --- platform bindings -------------------------------------------------------
jni = "0.22"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# --- dev ---------------------------------------------------------------------
proptest = "1"

# --- internal crates (path for local dev; version required for publishing) ---
corduit-core = { path = "corduit-core", version = "0.1.0" }
corduit-dns = { path = "corduit-dns", version = "0.1.0" }
corduit-lib = { path = "corduit-lib", version = "0.1.0" }
corduit-netstack = { path = "corduit-netstack", version = "0.1.0" }
corduit-protocol = { path = "corduit-protocol", version = "0.1.0" }
