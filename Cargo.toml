[package]
name = "corduit"
version = "0.3.5"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
authors = ["blueokanna", "HyphenTeam"]
description = "A synchronous, no_std-ready unified network proxy engine core by rust"
homepage = "https://github.com/blueokanna/Corduit"
repository = "https://github.com/blueokanna/Corduit"
readme = "README.md"
keywords = ["proxy", "protocol", "network", "tun", "vpn"]
categories = ["network-programming", "web-programming", "no-std"]

[features]
default = ["std", "tls", "wireguard"]

std = [
    "tls",
    "dep:dashmap",
    "dep:getrandom",
    "dep:ipnet",
    "dep:once_cell",
    "dep:parking_lot",
    "dep:regex",
    "dep:rustbinary",
    "dep:smoltcp",
    "dep:socket2",
    "dep:sysinfo",
    "dep:mach2",
    "dep:tracing",
    "dep:tracing-subscriber",
    "bytes/std",
    "courierust/std",
    "dep:recurse-x",
    "recurse-x/std",
    "recurse-x/dot",
    "recurse-x/doh",
    "recurse-x/doh3",
    "recurse-x/doq",
    "recurse-x/persist",
    "dep:libc",
    "dep:tun-rs",
    "dep:wintun-bindings",
    "dep:tempfile",
    "dep:zip",
    "dep:windows",
    "dep:jni",
    "dep:tracing-android",
    "thiserror/std",
]
tls = []

wireguard = ["std"]
quic = ["std"]
tuic = ["quic"]
hysteria = ["quic"]
hysteria2 = ["quic"]
tls13 = ["std"]
reality = ["tls13"]
shadowtls = ["tls13"]

[dependencies]

# --- concurrency / sync primitives (std only) -------------------------------
parking_lot = { version = "0.12.5", optional = true }
dashmap = { version = "6", optional = true }
once_cell = { version = "1", optional = true }

# --- error handling ----------------------------------------------------------
thiserror = { version = "2.0.21", default-features = false }

# --- codec / time  -------------------------------
nextjson = { version = "0.1.5", default-features = false, features = [
    "derive",
] }
rustbinary = { version = "0.1.10", default-features = false, features = [
    "derive",
], optional = true }

# --- tracing / telemetry (std only) -----------------------------------------
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

# --- HTTP / TLS / QUIC / multithreading --
courierust = { version = "1.1.2", default-features = false }

# --- DNS ---------------------------------------------------------------------
recurse-x = { version = "0.2.6", default-features = false, optional = true }
ipnet = { version = "2.12.2", optional = true }


# --- crypto ------------------------------------------------------------------
getrandom = { version = "0.4.3", features = ["std"], optional = true }

# --- networking / system (std only) -----------------------------------------
bitflags = "2.13.2"
bytes = { version = "1", default-features = false }
regex = { version = "1", optional = true }
smoltcp = { version = "0.12.0", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
], optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
[target.'cfg(not(target_os = "ios"))'.dependencies]
sysinfo = { version = "0.38", default-features = false, features = [
    "system",
], optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = { version = "0.7", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false, optional = true }

[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "macos", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
tun-rs = { version = "2.8.18", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
wintun-bindings = { version = "0.7", optional = true }
tempfile = { version = "3.27", optional = true }
zip = { version = "9.5.0", optional = true, default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
libc = { version = "0.2", default-features = false, optional = true }
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", optional = true }
tracing-android = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1.8.0"

[package.metadata.docs.rs]
all-features = true
