[package]
name = "corduit"
version = "0.1.3"
edition = "2021"
rust-version = "1.78"
license-file = "LICENSE"
authors = ["blueokanna"]
description = "A synchronous, no_std-ready unified network proxy engine core written in Rust"
homepage = "https://github.com/blueokanna/Corduit"
repository = "https://github.com/blueokanna/Corduit"
readme = "README.md"
keywords = ["proxy", "protocol", "network", "tun", "vpn"]
categories = [
    "network-programming",
    "web-programming",
    "no-std",
    "networking",
]

[features]
default = ["std", "tls", "wireguard"]
std = []
tls = []
wireguard = []

[dependencies]

# --- concurrency / sync primitives ------------------------------------------
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"

# --- error handling ----------------------------------------------------------
thiserror = "2.0.20"

# --- codec / time  -------------------------------
nextjson = { version = "0.1.4", features = ["derive"] }
rustbinary = { version = "0.1.8", default-features = false, features = [
    "derive",
    "std",
] }

# --- tracing / telemetry -----------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- HTTP / TLS / QUIC / multithreading --
courierust = { version = "1.0.3" }

# --- DNS ---------------------------------------------------------------------
ipnet = "2"
lru = "=0.16.4"

# --- crypto ------------------------------------------------------------------
getrandom = { version = "0.3.2", features = ["std"] }

# --- networking / system -----------------------------------------------------
bitflags = "2"
bytes = "1"
libc = "0.2"
regex = "1"
smoltcp = { version = "=0.11.0", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-udp",
    "socket-tcp",
] }
socket2 = { version = "0.6", features = ["all"] }
sysinfo = "=0.36.1"
tun-rs = { version = "=2.5.7" }

[target.'cfg(windows)'.dependencies]
wintun-bindings = { version = "0.7" }
zip = { version = "=4.2.0", default-features = false, features = ["deflate"] }
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
tracing-android = "0.2"

[dev-dependencies]
proptest = "=1.8.0"
