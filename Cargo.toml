[package]
name = "corduit"
version = "0.2.1"
edition = "2021"
rust-version = "1.78"
license-file = "LICENSE"
authors = ["blueokanna"]
description = "A synchronous, no_std-ready unified network proxy engine core"
homepage = "https://github.com/blueokanna/Corduit"
repository = "https://github.com/blueokanna/Corduit"
readme = "README.md"
keywords = ["proxy", "protocol", "network", "tun", "vpn"]
categories = ["network-programming", "web-programming", "no-std"]

[features]
default = ["std", "tls", "wireguard"]

std = [
    "tls",
    "dep:dashmap",
    "dep:getrandom",
    "dep:ipnet",
    "dep:once_cell",
    "dep:parking_lot",
    "dep:regex",
    "dep:rustbinary",
    "dep:smoltcp",
    "dep:socket2",
    "dep:sysinfo",
    "dep:tracing",
    "dep:tracing-subscriber",
    "bytes/std",
    "courierust/std",
    "nextjson/std",
    "thiserror/std",
]
tls = []

wireguard = ["std"]
quic = ["std"]
tuic = ["quic"]
hysteria = ["quic"]
hysteria2 = ["quic"]
tls13 = ["std"]
reality = ["tls13"]
shadowtls = ["tls13"]

[dependencies]

# --- concurrency / sync primitives (std only) -------------------------------
parking_lot = { version = "0.12", optional = true }
dashmap = { version = "6", optional = true }
once_cell = { version = "1", optional = true }

# --- error handling ----------------------------------------------------------
thiserror = { version = "2.0.21", default-features = false }

# --- codec / time  -------------------------------
nextjson = { version = "0.1.4", default-features = false, features = [
    "derive",
] }
rustbinary = { version = "0.1.8", default-features = false, features = [
    "derive",
    "std",
], optional = true }

# --- tracing / telemetry (std only) -----------------------------------------
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }

# --- HTTP / TLS / QUIC / multithreading --
courierust = { version = "1.0.7", default-features = false }

# --- DNS ---------------------------------------------------------------------
recurse-x = { version = "0.2.1", default-features = false, features = [
    "std",
    "dot",
    "doh",
    "doh3",
    "doq",
    "persist",
] }
ipnet = { version = "2.12.2", optional = true }


# --- crypto ------------------------------------------------------------------
getrandom = { version = "0.3.2", features = ["std"], optional = true }

# --- networking / system (std only) -----------------------------------------
bitflags = "2.13.2"
bytes = { version = "1", default-features = false }
regex = { version = "1", optional = true }
smoltcp = { version = "0.11.0", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
], optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
sysinfo = { version = "=0.36.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "macos", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
tun-rs = { version = "=2.5.7" }

[target.'cfg(windows)'.dependencies]
wintun-bindings = { version = "0.7" }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
libc = "0.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tracing-android = "0.2"

[dev-dependencies]
proptest = "1.8.0"

[package.metadata.docs.rs]
all-features = true
