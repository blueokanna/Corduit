[workspace]
resolver = "2"
members = [
    "corduit-common",
    "corduit-core",
    "corduit-crypto",
    "corduit-dns",
    "corduit-lib",
    "corduit-netstack",
    "corduit-protocol",
]

[workspace.package]
edition = "2021"
license = "PolyForm-Perimeter-1.0.1"
version = "0.1.0"
authors = ["blueokanna"]
rust-version = "1.81"
description = "A unified network proxy engine written in Rust"
homepage = "https://github.com/blueokanna/Corduit"
repository = "https://github.com/blueokanna/Corduit"
readme = "README.md"
keywords = ["proxy", "protocol", "network", "tun", "rust"]
categories = [
    "network-programming",
    "web-programming",
    "protocol-implementation",
    "asynchronous",
]

[workspace.dependencies]

# --- async runtime / concurrency --------------------------------------------
async-trait = "0.1"
dashmap = "6"
futures = "0.3"
once_cell = "1"
parking_lot = "0.12"
pin-project-lite = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
tokio-util = { version = "0.7", features = ["net", "codec", "io", "compat"] }

# --- error handling ----------------------------------------------------------
thiserror = "2.0.20"

# --- nextjson / rustbinary (native) --------
nextjson = { version = "0.1.3", features = ["derive"] }
nextjson-derive = "0.1.3"
rustbinary = { version = "=0.1.5-alpha.1", features = ["derive"] }
rustbinary-derive = "0.1.4"

# --- tracing / telemetry -----------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-android = "0.2"

# --- HTTP --------------------------------------------------------------------
h2 = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server-auto",
    "client-legacy",
] }


# --- TLS / QUIC --------------------------------------------------------------
quinn = { version = "0.11", default-features = false, features = [
    "futures-io",
    "runtime-tokio",
    "rustls",
] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
tokio-tungstenite = "0.27"
webpki-roots = "1"

# --- DNS ---------------------------------------------------------------------
ipnet = "2"
lru = "0.16"

# --- crypto ------------------------------------------------------------------
getrandom = { version = "0.3", features = ["std"] }

# --- networking / system -----------------------------------------------------
bitflags = "2"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
libc = "0.2"
regex = "1"
smoltcp = { version = "0.11", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-udp",
    "socket-tcp",
] }
socket2 = { version = "0.6", features = ["all"] }
sysinfo = "0.33"
tun-rs = { version = "2", features = ["async", "async_framed"] }
wintun-bindings = { version = "0.7", features = ["async"] }
zip = { version = "4.0", default-features = false, features = ["deflate"] }

# --- platform bindings -------------------------------------------------------
jni = "0.22"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# --- dev ---------------------------------------------------------------------
proptest = "1"

# --- internal crates (path for local dev; version required for publishing) ---
corduit-common = { path = "corduit-common", version = "0.1.0" }
corduit-core = { path = "corduit-core", version = "0.1.0" }
corduit-crypto = { path = "corduit-crypto", version = "0.1.0" }
corduit-dns = { path = "corduit-dns", version = "0.1.0" }
corduit-lib = { path = "corduit-lib", version = "0.1.0" }
corduit-netstack = { path = "corduit-netstack", version = "0.1.0" }
corduit-protocol = { path = "corduit-protocol", version = "0.1.0" }
