[package]
name = "corduit"
version = "0.1.2"
edition = "2021"
license-file = "LICENSE"
authors = ["blueokanna"]
description = "A unified network proxy engine core written in Rust"
homepage = "https://github.com/blueokanna/Corduit"
repository = "https://github.com/blueokanna/Corduit"
readme = "README.md"
keywords = ["proxy", "protocol", "network", "tun", "vpn"]
categories = [
    "network-programming",
    "web-programming",
    "asynchronous",
    "networking",
]

[features]
default = ["tls", "wireguard"]
tls = []
wireguard = []

[dependencies]

# --- async runtime / concurrency --------------------------------------------
async-trait = "0.1"
dashmap = "6"
futures = "0.3"
once_cell = "1"
parking_lot = "0.12"
pin-project-lite = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["net", "codec", "io", "compat"] }

# --- error handling ----------------------------------------------------------
thiserror = "2.0.20"

# --- required codec / time libraries ----------------------------------------
nextjson = { version = "0.1.4", features = ["derive"] }
rustbinary = { version = "0.1.7", default-features = false, features = [
    "derive",
    "std",
] }
tzcraft = { version = "0.1.2", features = ["std", "serde", "binary"] }

# --- tracing / telemetry -----------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- HTTP / TLS / QUIC (self-contained engine) ------------------------------
courierust = { version = "1.0.3" }

# --- DNS ---------------------------------------------------------------------
ipnet = "2"
lru = "0.18.2"

# --- crypto ------------------------------------------------------------------
getrandom = { version = "0.4.3", features = ["std"] }

# --- networking / system -----------------------------------------------------
bitflags = "2"
bytes = "1"
libc = "0.2"
regex = "1"
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-udp",
    "socket-tcp",
] }
socket2 = { version = "0.6", features = ["all"] }
sysinfo = "0.39.6"
tun-rs = { version = "2.8.8", features = ["async", "async_framed"] }

[target.'cfg(windows)'.dependencies]
wintun-bindings = { version = "0.7", features = ["async"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
tracing-android = "0.2"

[dev-dependencies]
proptest = "1.11.0"
tokio-test = "0.4"
