[package]
name = "corduit"
version = "0.1.2"
edition = "2021"
rust-version = "1.78"
license-file = "LICENSE"
authors = ["blueokanna"]
description = "A synchronous, no_std-ready unified network proxy engine core written in Rust"
homepage = "https://github.com/blueokanna/Corduit"
repository = "https://github.com/blueokanna/Corduit"
readme = "README.md"
keywords = ["proxy", "protocol", "network", "tun", "vpn", "no-std"]
categories = [
    "network-programming",
    "web-programming",
    "asynchronous",
    "networking",
]

[features]
default = ["std", "tls", "wireguard"]
std = []
tls = []
wireguard = []

# rustbinary 0.1.7 uses `core::error::Error` (error_in_core, stabilized in Rust
# 1.81), which breaks the declared MSRV 1.78. We vendor the crate under
# vendor/rustbinary with a minimal, feature-preserving patch that routes the
# std::error::Error impl through `std`; the API surface is unchanged.
[patch.crates-io]
rustbinary = { path = "vendor/rustbinary" }

[dependencies]

# --- concurrency / sync primitives ------------------------------------------
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"

# --- error handling ----------------------------------------------------------
thiserror = "2.0.20"

# --- codec / time  -------------------------------
nextjson = { version = "0.1.4", features = ["derive"] }
rustbinary = { version = "0.1.7", default-features = false, features = [
    "derive",
    "std",
] }
tzcraft = { version = "0.1.2", features = ["std", "serde", "binary"] }

# --- tracing / telemetry -----------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- HTTP / TLS / QUIC / multithreading --
courierust = { version = "1.0.3" }

# --- DNS ---------------------------------------------------------------------
ipnet = "2"
lru = "0.16"

# --- crypto ------------------------------------------------------------------
getrandom = { version = "0.3", features = ["std"] }

# --- networking / system -----------------------------------------------------
bitflags = "2"
bytes = "1"
libc = "0.2"
regex = "1"
smoltcp = { version = "0.11", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-udp",
    "socket-tcp",
] }
socket2 = { version = "0.6", features = ["all"] }
sysinfo = "0.36"
tun-rs = { version = "2" }

[target.'cfg(windows)'.dependencies]
wintun-bindings = { version = "0.7" }
zip = { version = "4", default-features = false, features = ["deflate"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
tracing-android = "0.2"

[dev-dependencies]
proptest = "1.8"
