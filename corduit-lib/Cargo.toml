[package]
name = "corduit-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.85"
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Hand-written C ABI bindings for the Corduit proxy engine"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "rust_lib_corduit"
crate-type = ["rlib", "cdylib", "staticlib"]

# HarmonyOS (OpenHarmony) targets expose `target_os = "ohos"`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("ohos"))',
] }

[dependencies]
aes-gcm = { workspace = true }
chrono = { workspace = true }
corduit-common = { workspace = true }
corduit-core = { workspace = true }
corduit-netstack = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
hkdf = { workspace = true }
md-5 = { workspace = true }
nextjson = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
rustbinary = { workspace = true }
sha1 = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
tracing-android = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = { workspace = true }
