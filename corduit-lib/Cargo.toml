[package]
name = "corduit-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Hand-written C ABI bindings for the Corduit proxy engine"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "rust_lib_corduit"
crate-type = ["rlib", "cdylib", "staticlib"]

# HarmonyOS (OpenHarmony) targets expose `target_os = "ohos"`; the
# check-cfg for it lives in `.cargo/config.toml` so cargo 1.78 can parse
# this manifest ([lints.rust].check-cfg needs cargo 1.80+).

[dependencies]
chrono = { workspace = true }
corduit-common = { workspace = true }
corduit-core = { workspace = true }
corduit-crypto = { workspace = true }
corduit-netstack = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
nextjson = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
rustbinary = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
tracing-android = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = { workspace = true }
